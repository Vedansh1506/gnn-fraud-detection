name: gnn-fraud-detection

# neo4j, redpanda and postgres are real infra services. `frontend` builds the
# React dashboard and serves it from nginx. `api` is still a placeholder: the
# FastAPI service is run from the host during development
# (`uv run uvicorn src.api.main:app --port 8000`) because it loads ~700k
# embeddings at startup and rebuilding an image for every change is slower than
# reloading in place. It gets a real build context at the cloud-deploy step.

services:
  neo4j:
    image: neo4j:5.26.25-community
    container_name: neo4j
    # No env_file here: the official image auto-converts every NEO4J_*
    # variable it sees into a server config setting, so our own app-level
    # NEO4J_URI (meant for src/common/config.py, not the server) would leak
    # in and crash the container under strict config validation. Pass only
    # the one variable Neo4j itself actually reads.
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v26.2.2
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "19092:19092" # kafka-API listener reachable from the host
      - "9644:9644"   # admin/healthcheck API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16.15-alpine
    container_name: postgres
    # No env_file: same reasoning as neo4j above - pass only what the
    # postgres image itself recognizes, not the whole app config.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when the volume is empty; see the mlflow service's note.
      - ./scripts/init-mlflow-db.sql:/docker-entrypoint-initdb.d/init-mlflow-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    # Placeholder for C8 (FastAPI scoring service). No Dockerfile yet -
    # replace `image`/`command` with `build: ./src/api` once the service exists.
    image: python:3.11-slim
    container_name: api
    env_file:
      - path: .env
        required: false
    command: ["sleep", "infinity"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - postgres
      - neo4j
      - redpanda

  mlflow:
    # C11, experiment tracking. Backed by the same Postgres instance but its
    # own `mlflow` database - MLflow manages its own schema, and letting it
    # create tables alongside audit_log/feedback would tangle two migration
    # stories together.
    #
    # The database is created by `scripts/init-mlflow-db.sql` on a *fresh*
    # Postgres volume. An already-initialised volume skips init scripts
    # entirely, so on an existing setup create it once by hand:
    #   docker exec postgres psql -U $POSTGRES_USER -d postgres -c "CREATE DATABASE mlflow"
    image: ghcr.io/mlflow/mlflow:v3.16.0
    container_name: mlflow
    # One line on purpose. In a YAML folded scalar (`>`) any line indented
    # MORE than the first keeps its newline, and inside `sh -c "..."` a newline
    # is a command separator - so a prettily-wrapped version silently ran bare
    # `mlflow server` with its defaults (loopback bind, local file store) and
    # every flag below as a separate failing command. The container looked
    # healthy and was unreachable.
    command: sh -c "pip install --no-cache-dir psycopg2-binary >/dev/null 2>&1 && exec mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow --default-artifact-root /mlflow/artifacts"
    ports:
      - "${MLFLOW_PORT:-5500}:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    # C10, the React dashboard (replaced Streamlit on 2026-09-13).
    build:
      context: ./frontend
      args:
        # Baked in at build time - Vite has no runtime env. The browser, not
        # the container, makes these calls, so this is the URL as the *user's
        # browser* sees the API, never the compose service name.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: frontend
    ports:
      - "${DASHBOARD_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  neo4j_data:
  redpanda_data:
  postgres_data:
  mlflow_artifacts:
