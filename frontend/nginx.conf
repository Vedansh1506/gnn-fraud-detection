server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Client-side routing: an analyst deep-linking to /ops must get index.html
  # rather than a 404 from nginx looking for a directory that does not exist.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset filenames make these safe to cache hard; index.html must not
  # be, or a deploy leaves browsers pinned to the previous bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The API is reached through this server rather than on its own public port:
  # the browser calls /api/..., nginx forwards to the api container and strips
  # the prefix. Same origin, so no CORS preflight in production, and only port
  # 80 has to be open to the internet. (Local dev still calls :8000 directly,
  # with CORS, as before.)
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A cold graph query can take 20+ seconds on the first click; the default
    # 60s is enough, but do not let it be shorter.
    proxy_read_timeout 90s;
  }
}
