server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Client-side routing: an analyst deep-linking to /ops must get index.html
  # rather than a 404 from nginx looking for a directory that does not exist.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset filenames make these safe to cache hard; index.html must not
  # be, or a deploy leaves browsers pinned to the previous bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
